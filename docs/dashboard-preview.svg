nce Fiction</text><text x="115" y="477">Comedy</text></g><rect x="603" y="230" width="549" height="185" rx="12" fill="white" stroke="#e4e7ec"/><text x="627" y="264" font-size="18" font-weight="700" fill="#172033">Average rating over time</text><line x1="650" y1="370" x2="1110" y2="370" stroke="#98a2b3"/><polyline points="650,345 720,338 790,350 860,325 930,332 1000,310 1070,320 1110,300" fill="none" stroke="#667085" stroke-width="4"/><g fill="#667085"><circle cx="650" cy="345" r="5"/><circle cx="790" cy="350" r="5"/><circle cx="930" cy="332" r="5"/><circle cx="1070" cy="320" r="5"/></g><rect x="603" y="435" width="549" height="185" rx="12" fill="white" stroke="#e4e7ec"/><text x="627" y="469" font-size="18" font-weight="700" fill="#172033">Budget vs revenue</text><line x1="665" y1="575" x2="1095" y2="470" stroke="#d0d5dd"/><g fill="#667085"><circle cx="720" cy="545" r="9"/><circle cx="770" cy="530" r="7"/><circle cx="830" cy="520" r="11"/><circle cx="900" cy="505" r="8"/><circle cx="980" cy="485" r="13"/><circle cx="1050" cy="475" r="9"/></g><text x="627" y="598" font-size="12" fill="#667085">Higher budget does not automatically imply higher ROI.</text></g></svg>