name: Code, tests and evidence
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - run: python -m pip install pandas sqlalchemy
      - name: Install local package
        run: python -m pip install --no-deps -e .
      - name: Lint pipeline and application code
        run: |
          python -m pip install ruff==0.16.9
          ruff check pipeline.py dashboard.py app src tests ci/fake_tmdb.py ci/pipeline_check.py --select E4,E7,E9,F
      - name: Validate committed evidence
        run: python ci/verify_evidence.py
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_HOST: localhost
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: itc6050
          POSTGRES_PASSWORD: itc6050
          POSTGRES_DB: movies
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U itc6050"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Ingestion, dbt, snapshot and dashboard on a synthetic TMDB
        run: python ci/pipeline_check.py
