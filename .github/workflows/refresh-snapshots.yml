# Load a fresh TMDB snapshot for each sampling profile, test it with dbt and commit a dated summary.
# Needs a repository secret named TMDB_API_KEY. Runs monthly and on demand.
name: Refresh TMDB snapshots
on:
  schedule:
    - cron: '17 5 1 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      POSTGRES_HOST: localhost
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: itc6050
          POSTGRES_PASSWORD: itc6050
          POSTGRES_DB: movies
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U itc6050"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Require the TMDB key
        run: |
          test -n "$TMDB_API_KEY" || { echo "Add a repository secret named TMDB_API_KEY under Settings, Secrets and variables, Actions."; exit 1; }
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Load, test and summarise each sampling profile
        env:
          TMDB_YEAR_FROM: '2005'
        run: |
          export TMDB_YEAR_TO="$(date -u +%Y)"
          for profile in revenue stratified_year; do
            TMDB_SAMPLING="$profile" python pipeline.py
            (cd dbt && dbt run --profiles-dir . && dbt test --profiles-dir .)
            python -m movie_analytics.snapshot
          done
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: snapshots
          path: snapshots
      - name: Commit the summaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "Record TMDB snapshot summaries"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
